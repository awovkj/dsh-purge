name: Community release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: community-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    needs: installer
    if: github.repository == 'kingcharleslzy-ai/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/purge-panel/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm --prefix packages/purge-panel ci --ignore-scripts --legacy-peer-deps
      - run: npm run check:docs
      - run: npm run check:modes
      - run: npm run check:assessment
      - run: npm run check:client
      - run: npm --prefix packages/purge-panel run format:check
      - name: Build verified release assets
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(head -n 1 release-notes.md)" = "# $version"
          test "$(node -p "require('./package.json').name")" = "dsh-purge-community"
          npm pack --ignore-scripts
          node scripts/smoke.mjs
          cp "dsh-purge-community-$version.tgz" dsh-purge-community.tgz
          sha256sum "dsh-purge-community-$version.tgz" dsh-purge-community.tgz > SHA256SUMS.txt
      - name: Publish community release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" "dsh-purge-community-$version.tgz" dsh-purge-community.tgz SHA256SUMS.txt --verify-tag --title "dsh-purge Community $version" --notes-file release-notes.md

  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Verify packed artifact on each platform
        run: npm pack --ignore-scripts && node scripts/smoke.mjs
